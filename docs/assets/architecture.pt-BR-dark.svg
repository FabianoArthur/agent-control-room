<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-labelledby="title desc" lang="pt-BR">
<title id="title">Como o Agent Control Room funciona</title>
<desc id="desc">Você adiciona um pedido; ele espera numa fila FIFO. O escalonador entrega a um agente livre (no máximo N em paralelo), que ganha branch e worktree próprios e passa por plano, código, gates (typecheck, lint, testes) e revisão até abrir um pull request. Um gate falhando manda o agente de volta ao código uma vez; uma especificação ambígua ou um gate que continua falhando o pausa em 'precisa de você' até você (ou o piloto automático) destravar. Um relógio despacha um tick a cada 800 ms para um reducer puro cujo estado do PRNG vive dentro da simulação, então uma seed repete a mesma execução. O React renderiza o estado.</desc>
