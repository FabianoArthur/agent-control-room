6px)}24.00%{opacity:1;transform:translate(113px,262px)}26.00%,100%{opacity:0;transform:translate(113px,262px)}}.p2{animation:p2 11s linear infinite}@keyframes h2{0%,14.00%{opacity:0}15.00%,24.00%{opacity:.9}30.00%,100%{opacity:0}}.h2{animation:h2 11s linear infinite}@keyframes p3{0%,24.99%{opacity:0;transform:translate(178px,290px)}25.00%{opacity:1;transform:translate(178px,290px)}29.00%{opacity:1;transform:translate(208px,290px)}31.00%,100%{opacity:0;transform:translate(208px,290px)}}.p3{animation:p3 11s linear infinite}@keyframes h3{0%,24.00%{opacity:0}25.00%,29.00%{opacity:.9}35.00%,100%{opacity:0}}.h3{animation:h3 11s linear infinite}@keyframes p4{0%,29.99%{opacity:0;transform:translate(338px,290px)}30.00%{opacity:1;transform:translate(338px,290px)}34.00%{opacity:1;transform:translate(368px,290px)}36.00%,100%{opacity:0;transform:translate(368px,290px)}}.p4{animation:p4 11s linear infinite}@keyframes h4{0%,29.00%{opacity:0}30.00%,34.00%{opacity:.9}40.00%,100%{opacity:0}}.h4{animation:h4 11s linear infinite}@keyframes p5{0%,34.99%{opacity:0;transform:translate(528px,290px)}35.00%{opacity:1;transform:translate(528px,290px)}39.00%{opacity:1;transform:translate(558px,290px)}41.00%,100%{opacity:0;transform:translate(558px,290px)}}.p5{animation:p5 11s linear infinite}@keyframes h5{0%,34.00%{opacity:0}35.00%,39.00%{opacity:.9}45.00%,100%{opacity:0}}.h5{animation:h5 11s linear infinite}@keyframes p6{0%,39.99%{opacity:0;transform:translate(688px,290px)}40.00%{opacity:1;transform:translate(688px,290px)}44.00%{opacity:1;transform:translate(718px,290px)}46.00%,100%{opacity:0;transform:translate(718px,290px)}}.p6{animation:p6 11s linear infinite}@keyframes h6{0%,39.00%{opacity:0}40.00%,44.00%{opacity:.9}50.00%,100%{opacity:0}}.h6{animation:h6 11s linear infinite}@keyframes p7{0%,49.99%{opacity:0;transform:translate(440px,410px)}50.00%{opacity:1;transform:translate(440px,410px)}57.00%{opacity:1;transform:translate(440px,452px)}59.00%,100%{opacity:0;transform:translate(440px,452px)}}.p7{animation:p7 11s linear infinite}@keyframes h7{0%,49.00%{opacity:0}50.00%,57.00%{opacity:.9}63.00%,100%{opacity:0}}.h7{animation:h7 11s linear infinite}@keyframes p8{0%,63.99%{opacity:0;transform:translate(470px,262px)}64.00%{opacity:1;transform:translate(470px,262px)}68.26%{opacity:1;transform:translate(470px,173px)}72.00%{opacity:1;transform:translate(548px,173px)}74.00%,100%{opacity:0;transform:translate(548px,173px)}}.p8{animation:p8 11s linear infinite}@keyframes h8{0%,63.00%{opacity:0}64.00%,72.00%{opacity:.9}78.00%,100%{opacity:0}}.h8{animation:h8 11s linear infinite}@keyframes p9{0%,72.99%{opacity:0;transform:translate(640px,150px)}73.00%{opacity:1;transform:translate(640px,150px)}79.00%{opacity:1;transform:translate(640px,74px)}81.00%,100%{opacity:0;transform:translate(640px,74px)}}.p9{animation:p9 11s linear infinite}@keyframes h9{0%,72.00%{opacity:0}73.00%,79.00%{opacity:.9}85.00%,100%{opacity:0}}.h9{animation:h9 11s linear infinite}@keyframes p10{0%,80.99%{opacity:0;transform:translate(560px,196px)}81.00%{opacity:1;transform:translate(560px,196px)}82.17%{opacity:1;transform:translate(560px,242px)}89.49%{opacity:1;transform:translate(273px,242px)}90.00%{opacity:1;transform:translate(273px,262px)}92.00%,100%{opacity:0;transform:translate(273px,262px)}}.p10{animation:p10 11s linear infinite}@keyframes h10{0%,80.00%{opacity:0}81.00%,90.00%{opacity:.9}96.00%,100%{opacity:0}}.h10{animation:h10 11s linear infinite}@keyframes pr{0%,43%{opacity:0}46%,58%{opacity:1}66%,100%{opacity:0}}.prglow{fill:none;stroke:#fb923c;stroke-width:2;opacity:0;animation:pr 11s linear infinite}@keyframes nu{0%,70%{opacity:0}73%,86%{opacity:1}92%,100%{opacity:0}}.nuglow{fill:none;stroke:#fbbf24;stroke-width:2;opacity:0;animation:nu 11s linear infinite}@media (prefers-reduced-motion:reduce){.pk,.hl,.prglow,.nuglow{animation:none;display:none}}</style>
